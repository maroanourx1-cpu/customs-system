{% extends "base.html" %}
{% block body %}
<div class="bar"><h1>{{ ic('task') }} أمر تكليف جديد</h1></div>
<div class="card"><form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="row">
    <div><label>إلى الموظف *</label><select name="to" required><option value="">اختر...</option>
      {% for u in users %}<option value="{{ u.id }}" {{ 'selected' if f.to|string == u.id|string }}>{{ u.full_name }}</option>{% endfor %}</select></div>
    <div><label>رقم الشحنة *</label><input name="shipment" list="shiplist" value="{{ f.shipment or '' }}" required autocomplete="off" placeholder="SH-1001">
      <datalist id="shiplist">{% for sh in ships %}<option value="{{ sh.number }}">{{ sh.client }}</option>{% endfor %}</datalist></div>
  </div>
  <label>عنوان الأمر *</label><input name="title" value="{{ f.title or '' }}" maxlength="200" required placeholder="مثال: سحب إيصال النولون وتسليمه للمحاسب">
  <label>التفاصيل</label><textarea name="details" rows="4" placeholder="تعليمات إضافية...">{{ f.details or '' }}</textarea>
  <p class="mut">هيظهر للموظف تنبيه على كل الصفحات لحد ما يفتح الأمر ويقرأه. وقت الإرسال ووقت القراءة بيتسجلوا.</p>
  <p><button class="btn">{{ ic('send') }} إرسال الأمر</button> <a class="btn light" href="{{ url_for('tasks') }}">إلغاء</a></p>
</form></div>
{% endblock %}
