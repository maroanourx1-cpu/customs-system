name: Wipe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git ls-files | grep -v '^\.github/' | xargs git rm -q
          git config user.name "wipe"
          git config user.email "wipe@users.noreply.github.com"
          git commit -m "Remove all files"
          git push
