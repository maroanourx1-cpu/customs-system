{% extends "base.html" %}
{% block body %}
<div class="bar"><h1>{{ ic('search') }} البحث والاستعلام</h1></div>
<div class="card">
  <form method="get">
    <div class="row">
      <div><label>اسم الشركة</label><input name="client" value="{{ request.args.get('client','') }}"></div>
      <div><label>رقم البوليصة</label><input name="bl" value="{{ request.args.get('bl','') }}"></div>
      <div><label>رقم الشحنة</label><input name="number" value="{{ request.args.get('number','') }}"></div>
      <div><label>شركة الشحن</label><input name="carrier" value="{{ request.args.get('carrier','') }}"></div>
      <div><label>المورد</label><input name="supplier" value="{{ request.args.get('supplier','') }}"></div>
      <div><label>المنشأ</label><input name="origin" value="{{ request.args.get('origin','') }}"></div>
      <div><label>الرقم الضريبي</label><input name="tax_number" value="{{ request.args.get('tax_number','') }}"></div>
      <div><label>البند</label><input name="tariff_item" value="{{ request.args.get('tariff_item','') }}"></div>
    </div>
    <div class="row">
      <div><label>تاريخ الوصول من</label><input type="date" name="date_from" value="{{ request.args.get('date_from','') }}"></div>
      <div><label>إلى</label><input type="date" name="date_to" value="{{ request.args.get('date_to','') }}"></div>
      <div><label>الحالة</label><select name="status">
        <option value="">الكل</option>
        <option value="open" {{ 'selected' if request.args.get('status')=='open' }}>مفتوحة</option>
        <option value="closed" {{ 'selected' if request.args.get('status')=='closed' }}>منتهية</option></select></div>
      <button class="btn auto">بحث</button>
    </div>
  </form>
</div>
{% if searched %}<div class="card"><h3>النتائج ({{ rows|length }})</h3>{% include "_table.html" %}</div>{% endif %}
{% endblock %}
