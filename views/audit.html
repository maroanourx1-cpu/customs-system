{% extends "base.html" %}
{% block body %}
<div class="bar"><h1>{{ ic('history') }} سجل التعديلات</h1></div>
<div class="card">
  <form class="row" method="get" style="margin-bottom:14px"><input name="q" value="{{ request.args.get('q','') }}" placeholder="بحث بالموظف أو العملية أو التفاصيل..."><button class="btn auto">بحث</button></form>
  <div class="tablewrap"><table>
    <tr><th>الوقت</th><th>الموظف</th><th>العملية</th><th>التفاصيل</th></tr>
    {% for r in rows %}<tr><td>{{ r.ts }}</td><td>{{ r.username }}</td><td>{{ r.action }}</td>
      <td>{% if r.entity=='shipment' %}<a href="{{ url_for('shipment_detail', sid=r.entity_id) }}">#{{ r.entity_id }}</a> {% endif %}{{ r.details }}</td></tr>
    {% else %}<tr><td colspan="4" class="empty">لا يوجد سجل</td></tr>{% endfor %}
  </table></div>
</div>
{% endblock %}
